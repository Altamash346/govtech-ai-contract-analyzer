<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>JanDrishti | Citizen Welfare & Legal Contract Intelligence Platform</title>
    <meta name="description" content="JanDrishti — Sovereign AI-powered legal contract auditing, visual PDF redlining, and citizen welfare scheme recommendation platform." />
    <meta name="theme-color" content="#0a2540" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JanDrishti" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
    <style>
      /* Clean Government Portal Multilingual Styling */
      body { top: 0px !important; position: static !important; }
      .goog-te-banner-frame.skiptranslate, .goog-te-banner-frame { display: none !important; }
      #goog-gt-tt, .goog-te-balloon-frame { display: none !important; }
      .goog-text-highlight { background: none !important; box-shadow: none !important; }
      #google_translate_element { display: none; }
      font { background: transparent !important; }
      .skiptranslate:not(.allow-show) { display: none !important; }
    </style>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        try {
          if (window.google && window.google.translate && window.google.translate.TranslateElement) {
            new google.translate.TranslateElement({
              pageLanguage: 'en',
              includedLanguages: 'en,hi,mr,bn,ta,te,gu,kn,ml,pa,or,as,ur,sa,ne,sd,mai,kok,doi,mni,sat,bho',
              autoDisplay: false
            }, 'google_translate_element');
          }
        } catch (e) {
          console.warn('Translate element init bypassed:', e);
        }
      }
    </script>
    <script async defer type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  </head>
  <body>
    <div id="google_translate_element"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Service worker is for web browser (PWA) only — never register inside native mobile apps
      const isMobileNative = Boolean(window.Capacitor?.isNativePlatform?.()) || 
                             window.location.protocol === 'capacitor:' || 
                             (window.location.hostname === 'localhost' && !window.location.port);
      if (!isMobileNative && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      } else if (isMobileNative && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) reg.unregister();
        }).catch(() => {});
      }
    </script>
  </body>
</html>
